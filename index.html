
<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DEALBRIDGE</title>
<style>
:root{--bg:#080d20;--panel:#141b36;--line:#303958;--purple:#9369ff;--text:#f5f6ff;--muted:#aab3cf}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
header{position:sticky;top:0;z-index:10;background:#0b1027;border-bottom:1px solid var(--line)}
nav{max-width:1200px;margin:auto;padding:18px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.logo{font-size:24px;font-weight:900;color:#b9a0ff}
.links{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
a{color:inherit;text-decoration:none}
a:hover{color:#b9a0ff}
.btn{border:0;border-radius:10px;padding:12px 19px;background:var(--purple);color:white;font-weight:bold}
.btn:hover{background:#7950e5}
.btn:disabled{opacity:.5;cursor:wait}
.secondary{background:#263052}
.secondary:hover{background:#39446d}
.hero{padding:90px 20px;text-align:center;background:radial-gradient(ellipse at top,#34205e,#080d20 72%)}
.hero h1{font-size:clamp(34px,6vw,64px);margin:0 0 20px;line-height:1.15}
.hero h1 span{color:#ac8aff}
.hero p{color:var(--muted);font-size:18px}
.search{max-width:950px;margin:35px auto 0;background:var(--panel);padding:14px;border-radius:16px;display:grid;grid-template-columns:2fr 1fr auto;gap:10px;border:1px solid var(--line)}
input,select,textarea{width:100%;padding:13px;border-radius:9px;background:#0b122b;color:white;border:1px solid var(--line)}
#languageSwitcher{width:auto;min-width:145px}
main{max-width:1200px;margin:auto;padding:35px 20px}
h2{font-size:29px}
.muted{color:var(--muted)}
.categories{display:flex;gap:12px;flex-wrap:wrap;margin:25px 0}
.category{padding:13px 18px;border-radius:12px;background:var(--panel);border:1px solid var(--line);color:white}
.category.active{background:#50359b;border-color:#a78bfa}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:25px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.visual{height:155px;display:grid;place-items:center;font-size:58px;background:linear-gradient(135deg,#26386c,#53308c)}
.content{padding:20px}
.content h3{margin:5px 0 12px;overflow-wrap:anywhere}
.price{color:#c4afff;font-size:24px;font-weight:bold}
.tag{color:#b7a0ff;font-size:13px;font-weight:bold}
.card .btn{margin-top:15px;width:100%}
.empty{padding:35px;text-align:center;color:var(--muted)}
footer{text-align:center;padding:35px;border-top:1px solid var(--line);color:var(--muted)}
.overlay{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:30;padding:15px}
.overlay.show{display:flex}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:25px;width:100%;max-width:520px;max-height:90vh;overflow:auto}
.modal label{display:block;margin:13px 0 6px}
.modal-actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.notice{font-size:13px;color:var(--muted);line-height:1.5}
.status{max-width:1200px;margin:15px auto;padding:12px 20px;color:#d5c7ff}
.status:empty{display:none}
.account{font-size:13px;color:var(--muted);max-width:200px;overflow-wrap:anywhere}
.hidden{display:none!important}
@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}.search{grid-template-columns:1fr}}
@media(max-width:550px){.grid{grid-template-columns:1fr}.hero{padding:60px 15px}.links{gap:10px}#languageSwitcher{width:100%}}
</style>
</head>
<body>

<header>
<nav>
<a class="logo" href="#">◆ DEALBRIDGE</a>
<div class="links">
<select id="languageSwitcher" aria-label="Language">
<option value="sk">🇸🇰 Slovenčina</option>
<option value="hu">🇭🇺 Magyar</option>
<option value="en">🇬🇧 English</option>
<option value="de">🇩🇪 Deutsch</option>
<option value="pl">🇵🇱 Polski</option>
</select>
<a href="#offers" id="navOffers"></a>
<a href="#about" id="navAbout"></a>
<span class="account" id="accountEmail"></span>
<button class="btn secondary" id="authBtn" type="button"></button>
<button class="btn secondary hidden" id="logoutBtn" type="button"></button>
<button class="btn" id="addBtn" type="button"></button>
</div>
</nav>
</header>

<div class="status" id="statusMessage" role="status"></div>

<section class="hero">
<h1 id="heroTitle"></h1>
<p id="heroSubtitle"></p>
<div class="search">
<input id="searchInput" type="search" maxlength="100">
<select id="categorySelect"></select>
<button class="btn" id="searchBtn" type="button"></button>
</div>
</section>

<main>
<section id="offers">
<h2 id="offersTitle"></h2>
<p class="muted" id="offersSubtitle"></p>
<div class="categories" id="categories"></div>
<p id="count" class="muted"></p>
<div class="grid" id="offersGrid"></div>
<div class="empty" id="empty" hidden></div>
</section>
<section id="about" style="margin-top:75px">
<h2 id="aboutTitle"></h2>
<p class="muted" id="aboutText"></p>
</section>
</main>

<footer id="footerText"></footer>

<div class="overlay" id="authOverlay">
<div class="modal" role="dialog" aria-modal="true">
<h2 id="authTitle"></h2>
<p class="notice" id="authNotice"></p>
<form id="authForm">
  <button class="btn secondary" type="button" id="googleLoginBtn" style="width:100%;margin:12px 0">
  🌐 Pokračovať cez Google
</button>
<p style="text-align:center;color:#aab3cf">alebo</p>

<label for="authEmail" id="emailLabel">Email</label>
<input id="authEmail" type="email" autocomplete="email" required maxlength="254">
<label for="authPassword" id="passwordLabel"></label>
<input id="authPassword" type="password" autocomplete="current-password" minlength="8" required>
<div class="modal-actions">
<button class="btn" type="submit" id="authSubmit"></button>
<button class="btn secondary" type="button" id="switchAuth"></button>
<button class="btn secondary" type="button" id="closeAuth"></button>
</div>
</form>
</div>
</div>

<div class="overlay" id="addOverlay">
<div class="modal" role="dialog" aria-modal="true">
<h2 id="addTitle"></h2>
<p class="notice" id="offerNotice"></p>
<form id="offerForm">
<label for="offerTitle" id="labelTitle"></label>
<input id="offerTitle" name="title" maxlength="80" required>
<label for="offerCategory" id="labelCategory"></label>
<select id="offerCategory" name="category"></select>
<label for="offerCity" id="labelCity"></label>
<input id="offerCity" name="city" maxlength="60" required>
<label for="offerPrice" id="labelPrice"></label>
<input id="offerPrice" name="price" type="number" min="0" max="1000000" step="0.01" required>
<label for="offerDescription" id="labelDescription"></label>
<textarea id="offerDescription" name="description" maxlength="500" rows="4" required></textarea>
<div class="modal-actions">
<button class="btn" type="submit" id="saveBtn"></button>
<button class="btn secondary" type="button" id="closeAdd"></button>
</div>
</form>
</div>
</div>

<div class="overlay" id="detailOverlay">
<div class="modal" role="dialog" aria-modal="true">
<h2 id="detailTitle"></h2>
<p id="detailCity"></p>
<p id="detailDescription"></p>
<h2 id="detailPrice"></h2>
<p class="notice" id="detailNotice"></p>
<div class="modal-actions">
<button class="btn secondary" id="closeDetail" type="button"></button>
</div>
</div>
</div>

let lang="sk";
let category="all";
let query="";
let offers=[];
let currentUser=null;
let authMode="login";
let db=null;

try{
 const saved=localStorage.getItem(LANG_KEY);
 if(translations[saved])lang=saved;
}catch(e){}

function t(){return translations[lang]}
function make(tag,cls,value){
 const el=document.createElement(tag);
 if(cls)el.className=cls;
 if(value!==undefined)el.textContent=value;
 return el;
}
function showStatus(message){
 $("statusMessage").textContent=message||"";
}
function priceText(value){
 const locale={sk:"sk-SK",hu:"hu-HU",en:"en-GB",de:"de-DE",pl:"pl-PL"}[lang];
 return Number(value).toLocaleString(locale,{
  minimumFractionDigits:0,
  maximumFractionDigits:2
 })+" €";
}
function categoryLabel(cat){
 const i=cats.indexOf(cat);
 return i<0?cat:t().cats[i];
}
function closeOverlay(id){$(id).classList.remove("show")}
function openOverlay(id){$(id).classList.add("show")}

function renderCategories(){
 for(const id of ["categorySelect","offerCategory"]){
  const select=$(id);
  const previous=select.value;
  select.replaceChildren();
  cats.forEach((cat,i)=>{
   if(id==="offerCategory"&&i===0)return;
   const option=make("option","",t().cats[i]);
   option.value=cat;
   select.append(option);
  });
  select.value=previous||(id==="categorySelect"?"all":"Szállás");
 }
 $("categories").replaceChildren();
 cats.forEach((cat,i)=>{
  const btn=make("button","category",emojis[i]+" "+t().cats[i]);
  btn.type="button";
  btn.dataset.cat=cat;
  btn.addEventListener("click",()=>{
   category=cat;
   $("categorySelect").value=cat;
   render();
  });
  $("categories").append(btn);
 });
}

function render(){
 const filtered=offers.filter(item=>{
  if(category!=="all"&&item.category!==category)return false;
  const words=[
   item.title,item.description,item.city,categoryLabel(item.category)
  ].join(" ").toLocaleLowerCase();
  return words.includes(query);
 });

 $("offersGrid").replaceChildren();
 $("count").textContent=filtered.length+" "+t().found;
 $("empty").hidden=filtered.length!==0;

 for(const item of filtered){
  const card=make("article","card");
  const visual=make(
   "div","visual",
   emojis[Math.max(1,cats.indexOf(item.category))]
  );
  const content=make("div","content");
  const btn=make("button","btn",t().details);
  btn.type="button";
  btn.addEventListener("click",()=>openDetail(item));
  content.append(
   make("div","tag",t().published),
   make("h3","",item.title),
   make("p","muted","📍 "+item.city),
   make("div","price",priceText(item.price)),
   btn
  );
  card.append(visual,content);
  $("offersGrid").append(card);
 }

 document.querySelectorAll(".category").forEach(btn=>{
  btn.classList.toggle("active",btn.dataset.cat===category);
 });
 $("categorySelect").value=category;
}

function updateAccount(){
 $("accountEmail").textContent=currentUser?.email||"";
 $("authBtn").classList.toggle("hidden",!!currentUser);
 $("logoutBtn").classList.toggle("hidden",!currentUser);
}

function updateAuthModal(){
 $("authTitle").textContent=authMode==="login"?t().login:t().register;
 $("authSubmit").textContent=authMode==="login"?t().login:t().register;
 $("switchAuth").textContent=authMode==="login"?t().switchRegister:t().switchLogin;
 $("authNotice").textContent=t().authNotice;
 $("authPassword").autocomplete=authMode==="login"?"current-password":"new-password";
}

function applyLanguage(value){
 if(!translations[value])return;
 lang=value;
 document.documentElement.lang=value;
 $("languageSwitcher").value=value;
 try{localStorage.setItem(LANG_KEY,value)}catch(e){}
 const d=t();

 $("navOffers").textContent=d.navOffers;
 $("navAbout").textContent=d.navAbout;
 $("addBtn").textContent=d.add;
 $("authBtn").textContent=d.login;
 $("logoutBtn").textContent=d.logout;

 $("heroTitle").replaceChildren(
  document.createTextNode(d.headline),
  document.createElement("br"),
  make("span","",d.highlight)
 );
 $("heroSubtitle").textContent=d.subtitle;
 $("searchInput").placeholder=d.placeholder;
 $("searchBtn").textContent=d.search;
 $("offersTitle").textContent=d.offers;
 $("offersSubtitle").textContent=d.offersSub;
 $("empty").textContent=d.empty;
 $("aboutTitle").textContent=d.about;
 $("aboutText").textContent=d.aboutText;
 $("footerText").textContent=d.footer;
 $("addTitle").textContent=d.newOffer;
 $("offerNotice").textContent=d.offerNotice;
 ["labelTitle","labelCategory","labelCity","labelPrice","labelDescription"]
 .forEach((id,i)=>$(id).textContent=d.labels[i]);
 $("saveBtn").textContent=d.save;
 $("closeAdd").textContent=d.cancel;
 $("closeAuth").textContent=d.cancel;
 $("closeDetail").textContent=d.close;
 $("passwordLabel").textContent=d.password;
 $("detailNotice").textContent=d.detailNotice;

 updateAuthModal();
 renderCategories();
 render();
 updateAccount();
}

function openDetail(item){
 $("detailTitle").textContent=item.title;
 $("detailCity").textContent=categoryLabel(item.category)+" • "+item.city;
 $("detailDescription").textContent=item.description;
 $("detailPrice").textContent=priceText(item.price);
 openOverlay("detailOverlay");
}

async function loadOffers(){
 if(!db)return;
 showStatus(t().loading);
 const {data,error}=await db.from("offers")
  .select("id,title,category,city,price,description")
  .eq("status","published")
  .order("created_at",{ascending:false})
  .limit(100);

 if(error){
  console.error("DEALBRIDGE load:",error.message);
  showStatus(t().connectionError);
  return;
 }
 offers=data||[];
 showStatus("");
 render();
}

function searchOffers(){
 query=$("searchInput").value.trim().toLocaleLowerCase();
 category=$("categorySelect").value;
 render();
 $("offers").scrollIntoView({behavior:"smooth"});
}

$("languageSwitcher").addEventListener("change",e=>applyLanguage(e.target.value));
$("searchBtn").addEventListener("click",searchOffers);
$("searchInput").addEventListener("keydown",e=>{
 if(e.key==="Enter")searchOffers();
});
$("categorySelect").addEventListener("change",searchOffers);

$("authBtn").addEventListener("click",()=>{
  $("googleLoginBtn").addEventListener("click", async () => {
  if (!db) {
    alert(t().setup);
    return;
  }

  const { error } = await db.auth.signInWithOAuth({
    provider: "google",
    options: {
      redirectTo: "https://dealbridge-web.github.io/"
    }
  });

  if (error) {
    alert(error.message);
  }
});

 authMode="login";
 updateAuthModal();
 openOverlay("authOverlay");
});
$("switchAuth").addEventListener("click",()=>{
 authMode=authMode==="login"?"register":"login";
 updateAuthModal();
});
$("closeAuth").addEventListener("click",()=>closeOverlay("authOverlay"));

$("authForm").addEventListener("submit",async e=>{
 e.preventDefault();
 if(!db){alert(t().setup);return;}

 const email=$("authEmail").value.trim();
 const password=$("authPassword").value;
 const btn=$("authSubmit");
 btn.disabled=true;

 try{
  let result;
  if(authMode==="register"){
   result=await db.auth.signUp({
    email,password,
    options:{emailRedirectTo:window.location.origin+window.location.pathname}
   });
  }else{
   result=await db.auth.signInWithPassword({email,password});
  }
  if(result.error)throw result.error;

  if(authMode==="register"){
   alert(t().confirmEmail);
  }else{
   currentUser=result.data.user;
   updateAccount();
   showStatus(t().loggedIn);
  }
  $("authForm").reset();
  closeOverlay("authOverlay");
 }catch(error){
  alert(error.message||String(error));
 }finally{
  btn.disabled=false;
 }
});

$("logoutBtn").addEventListener("click",async()=>{
 if(!db)return;
 const {error}=await db.auth.signOut();
 if(error){alert(error.message);return;}
 currentUser=null;
 updateAccount();
 showStatus(t().loggedOut);
});

$("addBtn").addEventListener("click",()=>{
 if(!currentUser){
  showStatus(t().needLogin);
  authMode="login";
  updateAuthModal();
  openOverlay("authOverlay");
  return;
 }
 openOverlay("addOverlay");
});
$("closeAdd").addEventListener("click",()=>closeOverlay("addOverlay"));
$("closeDetail").addEventListener("click",()=>closeOverlay("detailOverlay"));

$("offerForm").addEventListener("submit",async e=>{
 e.preventDefault();
 if(!db){alert(t().setup);return;}
 if(!currentUser){alert(t().needLogin);return;}

 const form=e.target;
 const data=new FormData(form);
 const price=Number(data.get("price"));
 const title=String(data.get("title")||"").trim();
 const categoryValue=String(data.get("category")||"");
 const city=String(data.get("city")||"").trim();
 const description=String(data.get("description")||"").trim();

 if(!Number.isFinite(price)||price<0||price>1000000){
  alert(t().invalid);
  return;
 }
 if(!title||!city||!description)return;
 if(!cats.slice(1).includes(categoryValue))return;

 const btn=$("saveBtn");
 btn.disabled=true;
 try{
  const {data:userData,error:userError}=await db.auth.getUser();
  if(userError||!userData.user)throw new Error(t().needLogin);

  const {error}=await db.from("offers").insert({
   title,
   category:categoryValue,
   city,
   price,
   description,
   status:"draft",
   owner_id:userData.user.id
  });
  if(error)throw error;

  form.reset();
  closeOverlay("addOverlay");
  showStatus(t().saved);
 }catch(error){
  alert(error.message||String(error));
 }finally{
  btn.disabled=false;
 }
});

["authOverlay","addOverlay","detailOverlay"].forEach(id=>{
 $(id).addEventListener("click",e=>{
  if(e.target===$(id))closeOverlay(id);
 });
});

document.addEventListener("keydown",e=>{
 if(e.key==="Escape"){
  ["authOverlay","addOverlay","detailOverlay"].forEach(closeOverlay);
 }
});

async function start(){
 applyLanguage(lang);

 if(!SUPABASE_KEY.startsWith("sb_publishable_")){
  showStatus(t().setup);
  return;
 }
 if(!window.supabase||!window.supabase.createClient){
  showStatus(t().connectionError);
  return;
 }

 try{
  db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{
   auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}
  });

  db.auth.onAuthStateChange((_event,session)=>{
   currentUser=session?.user||null;
   updateAccount();
  });

  const {data,error}=await db.auth.getSession();
  if(error)console.error("DEALBRIDGE auth:",error.message);
  currentUser=data?.session?.user||null;
  updateAccount();

  await loadOffers();
 }catch(error){
  console.error("DEALBRIDGE startup:",error);
  showStatus(t().connectionError);
 }
}

start();
</script>
